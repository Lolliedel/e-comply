<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ESSU E-Comply — Sign In</title>
<link rel="icon" type="image/png" href="ICON/ESSU.png">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Inter', sans-serif; }
  .font-display { font-family: 'Fraunces', serif; }
  .font-mono { font-family: 'IBM Plex Mono', monospace; }
  .seal { background: repeating-linear-gradient(135deg, #D9A62C 0 3px, transparent 3px 8px); }
</style>
</head>
<body class="bg-[#FAF7EF] text-[#1B2116] p-3 sm:p-6">

<!-- ══════════════════════ LOGIN SCREEN ══════════════════════ -->
<main id="loginScreen" class="max-w-sm mx-auto mt-16" role="main" aria-label="Sign In Workspace">
  <div class="text-center mb-6">
    <div class="w-20 h-20 mx-auto mb-3 rounded-full bg-white p-1.5 shadow-md border-2 border-[#D9A62C] flex items-center justify-center">
      <img src="ICON/ESSU.png" alt="Eastern Samar State University" class="w-full h-full object-contain">
    </div>
    <h1 class="font-display text-2xl font-bold text-[#14432A]">ESSU E-Comply</h1>
    <p class="text-xs font-semibold text-[#8A6A0C] tracking-wide uppercase mt-1">Eastern Samar State University Portal</p>
  </div>
  <form id="loginForm" class="bg-white border border-[#E3DFC8] rounded-xl p-4 sm:p-6 shadow-sm" aria-label="Portal Sign In Form">
    <div class="mb-4">
      <label class="block text-xs font-semibold text-[#52555C] mb-1.5">Username</label>
      <input id="loginUsername" class="font-mono w-full border border-[#DEDACE] rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:border-[#D9A62C]" autocomplete="username">
    </div>
    <div class="mb-5">
      <label class="block text-xs font-semibold text-[#52555C] mb-1.5">Password</label>
      <input id="loginPassword" type="password" class="font-mono w-full border border-[#DEDACE] rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:border-[#D9A62C]" autocomplete="current-password">
    </div>
    <p id="loginError" class="text-xs text-[#B3432B] mb-3 hidden"></p>
    <button type="submit" id="loginBtn" class="w-full bg-[#14432A] hover:bg-[#1B5636] text-white font-semibold text-sm py-2.5 rounded-lg transition">Sign in</button>
    
    <div class="relative my-4">
      <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-[#E3DFC8]"></div></div>
      <div class="relative flex justify-center text-xs uppercase"><span class="bg-white px-2 text-[#8A8D93]">Or</span></div>
    </div>

    <button type="button" id="biometricLoginBtn" class="w-full border border-[#DEDACE] hover:bg-[#FAF7EF] text-[#14432A] font-semibold text-sm py-2.5 rounded-lg transition flex items-center justify-center gap-2">
      <img src="ICON/biometric.svg" class="w-4 h-4 object-contain" alt="">
      <span>Sign in with Fingerprint</span>
    </button>
    <button type="button" id="qrLoginBtn" class="w-full mt-2 border border-[#DEDACE] hover:bg-[#FAF7EF] text-[#14432A] font-semibold text-sm py-2.5 rounded-lg transition flex items-center justify-center gap-2">
      <img src="ICON/qr.svg" class="w-4 h-4 object-contain" alt="">
      <span>Sign in with QR Code ID</span>
    </button>
    <div id="scannerStatusBadge" class="mt-2 text-center text-[11px] text-[#6B7060] flex items-center justify-center gap-1.5">
      <span id="scannerIndicator" class="w-1.5 h-1.5 rounded-full bg-[#8A8D93]"></span>
      <span id="scannerStatusText">ZKTeco Live20R: checking…</span>
    </div>
  </form>
</main>

<!-- ══════════════════ FORCE PASSWORD CHANGE ══════════════════ -->
<div id="forcePasswordScreen" class="hidden max-w-sm mx-auto mt-20">
  <div class="text-center mb-6">
    <div class="font-display text-xl font-bold">Set a new password</div>
    <div class="text-xs text-[#6B7060] mt-0.5">This is your first sign-in — choose a password only you know.</div>
  </div>
  <form id="forcePasswordForm" class="bg-white border border-[#E3DFC8] rounded-xl p-3 sm:p-6">
    <div class="mb-4">
      <label class="block text-xs font-semibold text-[#52555C] mb-1.5">New password</label>
      <input id="newPassword" type="password" class="font-mono w-full border border-[#DEDACE] rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:border-[#D9A62C]">
    </div>
    <div class="mb-5">
      <label class="block text-xs font-semibold text-[#52555C] mb-1.5">Confirm new password</label>
      <input id="confirmPassword" type="password" class="font-mono w-full border border-[#DEDACE] rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:border-[#D9A62C]">
    </div>
    <p id="forcePasswordError" class="text-xs text-[#B3432B] mb-3 hidden"></p>
    <button type="submit" class="w-full bg-[#14432A] hover:bg-[#1B5636] text-white font-semibold text-sm py-2.5 rounded-lg transition">Set password &amp; continue</button>
  </form>
</div>

<!-- ══════════════ NO PORTAL FOR THIS ROLE (yet) ══════════════ -->
<div id="noPortalScreen" class="hidden max-w-sm mx-auto mt-20 text-center">
  <div class="font-display text-xl font-bold mb-2">You're signed in</div>
  <p id="noPortalMessage" class="text-sm text-[#6B7060] mb-5"></p>
  <button onclick="portalLogout()" class="text-sm text-[#8A6A0C] hover:underline flex items-center justify-center gap-1 mx-auto"><img src="ICON/user.svg" class="w-3.5 h-3.5" alt=""> Sign out</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabaseClient.js"></script>
<script src="session.js"></script>
<script src="zktecoClient.js"></script>
<script src="qrClient.js"></script>
<script src="login.js"></script>
</body>
</html>
