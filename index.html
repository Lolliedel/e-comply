<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Portal Sign-In</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Inter', sans-serif; }
  .font-display { font-family: 'Fraunces', serif; }
  .font-mono { font-family: 'IBM Plex Mono', monospace; }
  .seal { background: repeating-linear-gradient(135deg, #D9A62C 0 3px, transparent 3px 8px); }
</style>
</head>
<body class="bg-[#FAF7EF] text-[#1B2116] p-3 sm:p-6">

<!-- ══════════════════════ LOGIN SCREEN ══════════════════════ -->
<div id="loginScreen" class="max-w-sm mx-auto mt-20">
  <div class="text-center mb-6">
    <div class="w-12 h-12 rounded-full seal mx-auto mb-3"></div>
    <div class="font-display text-xl font-bold">Portal Sign-In</div>
    <div class="text-xs text-[#6B7060] mt-0.5">Super Admin, Department Head, Faculty, and Student accounts all sign in here.</div>
  </div>
  <form id="loginForm" class="bg-white border border-[#E3DFC8] rounded-xl p-3 sm:p-6">
    <div class="mb-4">
      <label class="block text-xs font-semibold text-[#52555C] mb-1.5">Username</label>
      <input id="loginUsername" class="font-mono w-full border border-[#DEDACE] rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:border-[#D9A62C]" autocomplete="username">
    </div>
    <div class="mb-5">
      <label class="block text-xs font-semibold text-[#52555C] mb-1.5">Password</label>
      <input id="loginPassword" type="password" class="font-mono w-full border border-[#DEDACE] rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:border-[#D9A62C]" autocomplete="current-password">
    </div>
    <p id="loginError" class="text-xs text-[#B3432B] mb-3 hidden"></p>
    <button type="submit" id="loginBtn" class="w-full bg-[#14432A] hover:bg-[#1B5636] text-white font-semibold text-sm py-2.5 rounded-lg transition">Sign in</button>
  </form>
</div>

<!-- ══════════════════ FORCE PASSWORD CHANGE ══════════════════ -->
<div id="forcePasswordScreen" class="hidden max-w-sm mx-auto mt-20">
  <div class="text-center mb-6">
    <div class="font-display text-xl font-bold">Set a new password</div>
    <div class="text-xs text-[#6B7060] mt-0.5">This is your first sign-in — choose a password only you know.</div>
  </div>
  <form id="forcePasswordForm" class="bg-white border border-[#E3DFC8] rounded-xl p-3 sm:p-6">
    <div class="mb-4">
      <label class="block text-xs font-semibold text-[#52555C] mb-1.5">New password</label>
      <input id="newPassword" type="password" class="font-mono w-full border border-[#DEDACE] rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:border-[#D9A62C]">
    </div>
    <div class="mb-5">
      <label class="block text-xs font-semibold text-[#52555C] mb-1.5">Confirm new password</label>
      <input id="confirmPassword" type="password" class="font-mono w-full border border-[#DEDACE] rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:border-[#D9A62C]">
    </div>
    <p id="forcePasswordError" class="text-xs text-[#B3432B] mb-3 hidden"></p>
    <button type="submit" class="w-full bg-[#14432A] hover:bg-[#1B5636] text-white font-semibold text-sm py-2.5 rounded-lg transition">Set password &amp; continue</button>
  </form>
</div>

<!-- ══════════════ NO PORTAL FOR THIS ROLE (yet) ══════════════ -->
<div id="noPortalScreen" class="hidden max-w-sm mx-auto mt-20 text-center">
  <div class="font-display text-xl font-bold mb-2">You're signed in</div>
  <p id="noPortalMessage" class="text-sm text-[#6B7060] mb-5"></p>
  <button onclick="portalLogout()" class="text-sm text-[#8A6A0C] hover:underline">↩ Sign out</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabaseClient.js"></script>
<script src="session.js"></script>
<script src="login.js"></script>
</body>
</html>
