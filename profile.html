<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My Profile</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Inter', sans-serif; }
  .font-display { font-family: 'Fraunces', serif; }
  .font-mono { font-family: 'IBM Plex Mono', monospace; }
</style>
</head>
<body class="bg-[#FAF7EF] text-[#1B2116] p-3 sm:p-6">

<div id="loadingState" class="max-w-xl mx-auto mt-20 text-center text-sm text-[#6B7060]">Loading…</div>

<div id="appShell" class="hidden max-w-xl mx-auto">

  <div class="flex items-center justify-between mb-6">
    <a id="backLink" href="#" class="text-sm text-[#14432A] font-semibold hover:underline">← Back</a>
    <button onclick="portalLogout()" class="text-xs text-[#8A6A0C] hover:underline">↩ Sign out</button>
  </div>

  <form id="profileForm" class="bg-white border border-[#E3DFC8] rounded-xl p-3 sm:p-6 mb-5">

    <!-- AVATAR + ROLE -->
    <div class="flex items-center gap-4 mb-6 pb-5 border-b border-[#EFEBDB]">
      <div class="shrink-0 flex flex-col items-center gap-1.5">
        <div id="avatarPreview" class="w-16 h-16 rounded-full bg-[#1F6F4A] text-white flex items-center justify-center font-display font-bold text-xl overflow-hidden">—</div>
        <div class="flex items-center gap-2">
          <button type="button" id="uploadPhotoBtn" class="text-[11px] font-semibold text-[#8A6A0C] hover:underline">Upload</button>
          <button type="button" id="removePhotoBtn" class="text-[11px] font-semibold text-[#B3432B] hover:underline">Remove</button>
        </div>
        <input type="file" id="photoFileInput" accept="image/*" class="hidden">
      </div>
      <div>
        <div id="designationDisplay" class="text-xs font-bold uppercase tracking-wide text-[#8A6A0C]">—</div>
        <div id="roleLine" class="text-sm text-[#6B7060] mt-0.5">—</div>
      </div>
    </div>

    <!-- EDITABLE NAME -->
    <div class="flex gap-3">
      <div class="flex-1 mb-4">
        <label class="block text-xs font-semibold text-[#52555C] mb-1.5">Last Name</label>
        <input id="lastName" class="w-full border border-[#DEDACE] rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:border-[#D9A62C]">
      </div>
      <div class="flex-1 mb-4">
        <label class="block text-xs font-semibold text-[#52555C] mb-1.5">First Name</label>
        <input id="firstName" class="w-full border border-[#DEDACE] rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:border-[#D9A62C]">
      </div>
    </div>

    <div id="middleInitialRow" class="w-28 mb-5">
      <label class="block text-xs font-semibold text-[#52555C] mb-1.5">M.I.</label>
      <input id="middleInitial" maxlength="2" class="w-full border border-[#DEDACE] rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:border-[#D9A62C]">
    </div>

    <!-- READ-ONLY ACCOUNT INFO -->
    <div class="grid grid-cols-2 gap-4 pt-4 border-t border-[#EFEBDB] mb-2">
      <div>
        <div class="text-xs font-semibold text-[#8A8D93] uppercase tracking-wide mb-1">Username</div>
        <div id="usernameDisplay" class="font-mono text-sm">—</div>
      </div>
      <div>
        <div class="text-xs font-semibold text-[#8A8D93] uppercase tracking-wide mb-1">Department</div>
        <div id="departmentDisplay" class="text-sm">—</div>
      </div>
      <div id="collegeDisplayRow">
        <div class="text-xs font-semibold text-[#8A8D93] uppercase tracking-wide mb-1">College</div>
        <div id="collegeDisplay" class="text-sm">—</div>
      </div>
    </div>

    <p class="text-xs text-[#6B7060] mt-4 mb-5 pt-4 border-t border-dashed border-[#E3DFC8]">
      Your username, designation, department, and college are set by whoever created your account. To change your signature or biometric, contact them.
    </p>

    <button type="submit" id="saveBtn" class="w-full bg-[#14432A] hover:bg-[#1B5636] text-white font-semibold text-sm py-2.5 rounded-lg transition">Save changes</button>
  </form>

  <!-- TOAST -->
  <div id="toast" class="hidden fixed bottom-6 right-6 bg-[#14432A] text-white text-sm px-4 py-3 rounded-lg shadow-xl items-center gap-2">
    <span class="text-[#D9A62C]">✓</span> <span id="toastMsg"></span>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabaseClient.js"></script>
<script src="session.js"></script>
<script src="profile.js"></script>
</body>
</html>
