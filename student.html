<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Student Portal</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Inter', sans-serif; }
  .font-display { font-family: 'Fraunces', serif; }
  .font-mono { font-family: 'IBM Plex Mono', monospace; }
  .seal { background: repeating-linear-gradient(135deg, #D9A62C 0 3px, transparent 3px 8px); }
</style>
</head>
<body class="bg-[#FAF7EF] text-[#1B2116] p-3 sm:p-6">

<div id="appShell" class="hidden max-w-2xl mx-auto">

  <div class="flex items-center justify-between mb-6">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-full seal shrink-0"></div>
      <div>
        <div class="font-display text-lg font-bold leading-tight">Student Portal</div>
        <div id="headerDept" class="text-xs text-[#6B7060] mt-0.5">—</div>
      </div>
    </div>
    <div class="flex items-center gap-4">
      <a href="profile.html" class="text-xs font-semibold text-[#8A6A0C] hover:underline">Edit Profile</a>
      <button onclick="portalLogout()" class="text-xs text-[#8A6A0C] hover:underline">↩ Sign out</button>
    </div>
  </div>

  <div class="bg-white border border-[#E3DFC8] rounded-xl p-6 mb-5">
    <div class="flex items-center gap-4 mb-5">
      <div id="avatar" class="w-14 h-14 rounded-full bg-[#1F6F4A] text-white flex items-center justify-center font-display font-bold text-xl overflow-hidden">—</div>
      <div>
        <div id="fullName" class="font-display text-lg font-semibold">—</div>
        <div id="section" class="text-sm text-[#6B7060]">—</div>
      </div>
    </div>

    <div class="grid grid-cols-2 gap-4 pt-4 border-t border-[#EFEBDB]">
      <div class="bg-[#FCFBF6] border border-[#E3DFC8] rounded-lg p-3 flex items-center gap-2">
        <span id="signatureIcon" class="text-lg">✎</span>
        <div>
          <div class="text-xs font-semibold text-[#52555C]">E-Signature</div>
          <div id="signatureStatus" class="text-xs text-[#6B7060]">Not on file</div>
        </div>
      </div>
      <div class="bg-[#FCFBF6] border border-[#E3DFC8] rounded-lg p-3 flex items-center gap-2">
        <span id="biometricIcon" class="text-lg">🔒</span>
        <div>
          <div class="text-xs font-semibold text-[#52555C]">Biometric</div>
          <div id="biometricStatus" class="text-xs text-[#6B7060]">Not on file</div>
        </div>
      </div>
    </div>
  </div>

  <div class="bg-white border border-[#E3DFC8] rounded-xl p-6 text-sm text-[#6B7060]">
    Your signature and biometric were captured by your Department Head when your record was created. If anything here looks wrong, ask them to update it.
  </div>

  <!-- TOAST -->
  <div id="toast" class="hidden fixed bottom-6 right-6 bg-[#14432A] text-white text-sm px-4 py-3 rounded-lg shadow-xl items-center gap-2">
    <span class="text-[#D9A62C]">✓</span> <span id="toastMsg"></span>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabaseClient.js"></script>
<script src="session.js"></script>
<script src="student.js"></script>
</body>
</html>
