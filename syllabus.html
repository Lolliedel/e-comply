<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ESSU E-Comply — Course Syllabus</title>
<link rel="icon" type="image/png" href="ICON/ESSU.png">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Inter', sans-serif; }
  .font-display { font-family: 'Fraunces', serif; }
  .font-mono { font-family: 'IBM Plex Mono', monospace; }
  .doc-table td, .doc-table th { border: 1px solid #C9C2AC; padding: 8px 10px; vertical-align: top; }
  .doc-table { border-collapse: collapse; width: 100%; }
  .clo-check { width: 18px; height: 18px; accent-color: #14432A; }
  .field-input { width: 100%; border: none; outline: none; background: transparent; font-size: 13px; }
  .field-input:focus { background: #FBF3D9; }
  textarea.field-input { resize: vertical; min-height: 2.2em; }
</style>
</head>
<body class="bg-[#EFEBDB] text-[#1B2116] p-3 sm:p-6">

<div id="loadingState" class="max-w-3xl mx-auto mt-20 text-center text-sm text-[#6B7060]">Loading…</div>

<div id="appShell" class="hidden max-w-4xl mx-auto">

  <!-- TOP BAR -->
  <div class="flex flex-wrap items-center justify-between gap-2 mb-4">
    <a id="backLink" href="#" class="text-sm text-[#14432A] font-semibold hover:underline">← Back to Forms</a>
    <div class="flex items-center gap-3">
      <span id="saveStatus" class="text-xs text-[#6B7060]"></span>
      <button id="saveBtn" class="bg-[#14432A] hover:bg-[#1B5636] text-white text-sm font-semibold px-4 py-2 rounded-lg transition">Save Syllabus</button>
    </div>
  </div>

  <!-- DOCUMENT -->
  <div class="bg-white border border-[#DEDACE] shadow-sm p-8">

    <!-- HEADER (letterhead — fully editable) -->
    <div class="flex flex-col items-center mb-3">
      <div id="headerLogoPreview" class="w-16 h-16 rounded-lg border border-dashed border-[#C9C2AC] bg-[#FCFBF6] flex items-center justify-center text-[#B9B2A0] text-xs mb-2 overflow-hidden">No logo</div>
      <div class="flex items-center gap-3">
        <button type="button" id="uploadHeaderLogoBtn" class="text-xs font-semibold text-[#8A6A0C] hover:underline">Upload logo</button>
        <button type="button" id="removeHeaderLogoBtn" class="text-xs font-semibold text-[#B3432B] hover:underline">Remove</button>
      </div>
      <input type="file" id="headerLogoFileInput" accept="image/*" class="hidden">
    </div>
    <div class="text-center mb-1">
      <input id="institutionName" class="field-input font-display font-bold text-base text-center" value="Eastern Samar State University">
    </div>
    <div class="text-center mb-4">
      <input id="institutionTagline" class="field-input text-xs text-center text-[#6B7060]" placeholder="e.g. Graduate Program · College of Information Technology">
    </div>
    <div class="text-center mb-5">
      <input id="docTitle" class="field-input font-display font-bold text-lg text-center uppercase tracking-wide" value="Course Syllabus">
    </div>

    <!-- COURSE INFO TABLE -->
    <table class="doc-table mb-5 text-sm">
      <tr>
        <td class="w-1/2"><strong>Course Code:</strong><br><input id="courseCode" class="field-input font-mono"></td>
        <td class="w-1/2"><strong>Course Title:</strong><br><input id="courseTitle" class="field-input"></td>
      </tr>
      <tr>
        <td><strong>No. of Units:</strong><br><input id="units" class="field-input" placeholder="3 units"></td>
        <td><strong>Prerequisite/Co-requisite:</strong><br><input id="prerequisite" class="field-input"></td>
      </tr>
      <tr>
        <td colspan="2"><strong>Total No. of Hours:</strong><br><input id="totalHours" class="field-input"></td>
      </tr>
      <tr>
        <td colspan="2"><strong>Course Description:</strong><br><textarea id="courseDescription" class="field-input" rows="3"></textarea></td>
      </tr>
    </table>

    <!-- COURSE LEARNING OUTCOMES (dynamic — add as many CLOs as needed) -->
    <div class="mb-6">
      <div class="flex items-center justify-between mb-2">
        <strong class="text-sm">Course Learning Outcomes</strong>
        <button type="button" id="addCloBtn" class="text-xs text-[#8A6A0C] hover:underline">+ Add CLO</button>
      </div>
      <div id="cloList" class="space-y-2"></div>
    </div>

    <!-- COURSE LEARNING PLAN -->
    <div class="text-center font-display font-bold text-sm uppercase tracking-wide mb-2">Course Learning Plan</div>
    <div class="overflow-x-auto mb-2">
      <table class="doc-table text-xs" id="planTable">
        <thead id="planThead"></thead>
        <tbody id="planBody"></tbody>
      </table>
    </div>
    <button type="button" id="addRowBtn" class="text-xs text-[#8A6A0C] hover:underline mb-6">+ Add row</button>

    <!-- REFERENCES -->
    <table class="doc-table mb-6 text-sm">
      <tr>
        <td><strong>References:</strong> <span class="text-xs text-[#8A8D93]">(Full Citation of Reference Material)</span><br>
          <textarea id="fullReferences" class="field-input" rows="3"></textarea>
        </td>
      </tr>
    </table>

    <!-- FOOTER: DOCUMENT CONTROL -->
    <table class="doc-table text-xs">
      <tr>
        <td class="w-1/3">
          <div class="flex items-center gap-1 font-mono">
            <input id="docCode" class="field-input font-mono" style="width:auto; flex:1" value="ESSU-ACAD-500">
            <span>│</span>
            Version <input id="docVersion" class="field-input font-mono" style="width:2.5em" value="4">
          </div>
        </td>
        <td class="w-1/3"><input id="pageInfo" class="field-input" value="Page 1 of 1"></td>
        <td class="w-1/3">
          <strong>Effectivity Date:</strong>
          <input id="effectivityDate" type="date" class="field-input">
        </td>
      </tr>
    </table>

  </div>
</div>

<!-- TOAST -->
<div id="toast" class="hidden fixed bottom-6 right-6 bg-[#14432A] text-white text-sm px-4 py-3 rounded-lg shadow-xl items-center gap-2">
  <span class="text-[#D9A62C]">✓</span> <span id="toastMsg"></span>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabaseClient.js"></script>
<script src="session.js"></script>
<script src="qrClient.js"></script>
<script src="zktecoClient.js"></script>
<script src="biometricSigner.js"></script>
<script src="syllabus.js"></script>
</body>
</html>
